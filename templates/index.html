<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00174B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daybook">
<title>Daybook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<link rel="stylesheet" href="{{ asset('app.css') }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2300174B'/><path d='M8 16.5l5 5 11-11' stroke='%2300ACA3' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body data-signed-in="{{ 'yes' if signed_in else 'no' }}">

<div id="gate" class="gate" hidden>
  <form id="login-form" class="gate-card">
    <div class="gate-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="34" height="34"><path d="M6 17l6.5 6.5L26 9" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h1>Daybook</h1>
    <p class="gate-sub">A record of what you actually did.</p>
    <label class="field">
      <span>Password</span>
      <input type="password" id="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn btn-primary btn-block">Open the board</button>
    <p class="gate-error" id="gate-error" role="alert" hidden></p>
  </form>
</div>

<div id="app" class="app" hidden>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="18" height="18"><path d="M6 17l6.5 6.5L26 9" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="brand-name">Daybook</span>
    </div>

    <button class="icon-btn" id="rail-toggle" title="Hide the task list" aria-label="Hide the task list" aria-expanded="true">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9.5" y1="4" x2="9.5" y2="20"/></svg>
    </button>

    <nav class="views" role="tablist" aria-label="View">
      <button class="view-tab is-active" data-view="board" role="tab" aria-selected="true">Board</button>
      <button class="view-tab" data-view="record" role="tab" aria-selected="false">Record</button>
    </nav>

    <div class="topbar-right">
      <div class="period" id="period-controls">
        <button class="icon-btn" id="prev" aria-label="Previous period">&#8249;</button>
        <button class="period-label" id="period-label" title="Jump to today">—</button>
        <button class="icon-btn" id="next" aria-label="Next period">&#8250;</button>
      </div>
      <div class="seg" id="span-toggle" role="group" aria-label="Time span">
        <button class="seg-btn is-active" data-span="month">Month</button>
        <button class="seg-btn" data-span="week">Week</button>
      </div>
      <button class="icon-btn" id="sign-out" title="Sign out" aria-label="Sign out">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </header>

  <p class="offline-bar" id="offline-bar" role="status" hidden>
    <span class="offline-dot" aria-hidden="true"></span>
    Offline — this is the last board that loaded. Changes won’t save until you’re back.
  </p>

  <!-- ------------------------------------------------------------------ -->
  <main class="board" id="view-board">
    <aside class="rail">
      <form class="quick-add" id="quick-add">
        <input type="text" id="quick-title" placeholder="What needs doing?" autocomplete="off" aria-label="New task">
        <button type="submit" class="btn btn-primary" aria-label="Add task">Add</button>
      </form>

      <section class="rail-block" id="overdue-block" hidden>
        <h2 class="rail-head">
          <span class="dot dot-late" aria-hidden="true"></span>Running late
          <span class="rail-count" id="overdue-count">0</span>
        </h2>
        <div class="stack" id="overdue-list"></div>
      </section>

      <section class="rail-block rail-grow">
        <h2 class="rail-head">
          Unscheduled
          <span class="rail-count" id="backlog-count">0</span>
        </h2>
        <div class="stack dropzone stack-grow" id="backlog-list" data-day="backlog">
          <p class="empty-hint">Nothing waiting. Drop a task here to take it off the calendar.</p>
        </div>
      </section>

      <section class="rail-tally" id="rail-tally">
        <span class="tally-num" id="tally-num">0</span>
        <span class="tally-label" id="tally-label">ticked off this month</span>
      </section>
    </aside>

    <section class="calendar" id="calendar">
      <div class="weekday-row" id="weekday-row"></div>
      <div class="grid" id="grid"></div>
    </section>
  </main>

  <!-- ------------------------------------------------------------------ -->
  <main class="record" id="view-record" hidden>
    <div class="record-inner">
      <header class="record-head">
        <div>
          <p class="eyebrow">Record of work</p>
          <h1 class="record-title" id="record-title">—</h1>
        </div>
        <div class="record-actions">
          <select id="record-month" class="select" aria-label="Month"></select>
          <button class="btn" id="copy-report">Copy</button>
          <button class="btn" id="dl-md">.md</button>
          <button class="btn" id="dl-csv">.csv</button>
        </div>
      </header>

      <div class="tallies" id="tallies"></div>

      <div class="seg seg-wide" id="record-group" role="group" aria-label="Group by">
        <button class="seg-btn is-active" data-group="strand">By workstream</button>
        <button class="seg-btn" data-group="day">By day</button>
      </div>

      <div id="record-body"></div>
    </div>
  </main>

  <!-- ------------------------------------------------------------------ -->
  <div class="sheet-scrim" id="sheet-scrim" hidden></div>
  <aside class="sheet" id="sheet" hidden aria-label="Task detail">
    <header class="sheet-head">
      <button class="icon-btn" id="sheet-close" aria-label="Close">&times;</button>
      <span class="sheet-stamp mono" id="sheet-stamp"></span>
      <button class="icon-btn icon-danger" id="sheet-delete" aria-label="Delete task">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
      </button>
    </header>

    <div class="sheet-body">
      <label class="field">
        <span>Task</span>
        <textarea id="sheet-title" rows="2" class="sheet-title-input"></textarea>
      </label>

      <label class="field">
        <span>Detail <em>— what you'd tell management</em></span>
        <textarea id="sheet-notes" rows="7" placeholder="Context, outcome, numbers. This is what lands in the monthly record."></textarea>
      </label>

      <div class="field-row">
        <label class="field">
          <span>Workstream</span>
          <input type="text" id="sheet-strand" list="strand-list" placeholder="e.g. Paid media" autocomplete="off">
          <datalist id="strand-list"></datalist>
        </label>
        <label class="field">
          <span>Day</span>
          <input type="date" id="sheet-day">
        </label>
      </div>

      <button class="tick-big" id="sheet-tick">
        <span class="tick-box" aria-hidden="true"></span>
        <span class="tick-text">Mark as done</span>
      </button>
    </div>
  </aside>

  <div class="toast" id="toast" hidden></div>
</div>

<script src="{{ asset('app.js') }}"></script>
</body>
</html>
