name: donebook

services:
  donebook:
    build: .
    # Or, once images are published:
    # image: ghcr.io/YOURNAME/donebook:latest
    container_name: donebook
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - donebook-data:/data
    environment:
      # Donebook keeps the session cookie Secure by default, which means the
      # browser will only send it back over HTTPS. On a LAN address with no
      # TLS that looks like being signed out on every request, so this is on
      # here to make a first run work.
      #
      # DELETE THIS LINE once you have a reverse proxy terminating TLS.
      DONEBOOK_INSECURE_COOKIE: "1"
      TZ: UTC

volumes:
  donebook-data:
