# Reverse proxy for Donebook. Copy to /etc/nginx/sites-available/donebook,
# symlink it into sites-enabled, then run certbot for the certificate.
#
# Donebook is a single-password app with no per-user accounts, so do not put
# it on a public hostname without TLS — the password and session cookie
# would travel in clear text.

server {
    listen 80;
    server_name donebook.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name donebook.example.com;

    ssl_certificate     /etc/letsencrypt/live/donebook.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/donebook.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
