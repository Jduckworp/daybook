# Reverse proxy for Donebook. Copy to /etc/nginx/sites-available/donebook,
# symlink it into sites-enabled, then run certbot for the certificate.
#
# Donebook is a single-password app with no per-user accounts, so do not put
# it on a public hostname without TLS — the password and session cookie
# would travel in clear text.
#
# Set DONEBOOK_TRUSTED_PROXY=1 on the app when you put this in front of it.
# Without it the app ignores X-Forwarded-For and sees every request as coming
# from the proxy, which collapses its per-address sign-in limit into a global
# one — and a global one lets any passing bot lock the real user out.
#
# Expect bots immediately. Issuing the certificate publishes the hostname to
# public Certificate Transparency logs, and scanners read those logs and probe
# new hosts within seconds of the certificate being issued.

# Per-address throttle for sign-in. The app limits failures per address too,
# but every attempt that reaches it costs a 240k-round PBKDF2 hash, so without
# a limit in front a script does not need to guess the password to hurt the
# box — it only needs to keep asking. 12/minute is far beyond any human
# sign-in rate and far below what a guessing script wants.
limit_req_zone $binary_remote_addr zone=donebook_login:10m rate=12r/m;
limit_req_status 429;

server {
    listen 80;
    server_name donebook.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name donebook.example.com;

    ssl_certificate     /etc/letsencrypt/live/donebook.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/donebook.example.com/privkey.pem;

    location = /api/login {
        limit_req zone=donebook_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
